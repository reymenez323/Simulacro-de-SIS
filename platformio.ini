; ============================================================
;  Proyecto: SIS - Sistema Instrumentado de Seguridad
;  Control de ventilador por temperatura con ESP32 + FreeRTOS
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6

; Descomenta y ajusta si tu puerto no se detecta automáticamente
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

build_flags =
    -D CORE_DEBUG_LEVEL=3
